<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đố Vui Mất Não - Kawaii Blue</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #dbeeff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* SVG Vector Background Elements (Lineless) */
        .bg-decor {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .bear-container {
            bottom: -10px;
            left: 20px;
            width: 170px;
            height: 170px;
            animation: float 4s ease-in-out infinite;
        }

        .bow-container {
            top: 25px;
            right: 35px;
            width: 110px;
            height: 110px;
            animation: float 5s ease-in-out infinite reverse;
        }

        .cloud1 { top: 10%; left: 8%; opacity: 0.7; animation: drift 18s linear infinite; }
        .cloud2 { top: 60%; right: 5%; opacity: 0.6; animation: drift 22s linear infinite reverse; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        @keyframes drift {
            from { transform: translateX(-30px); }
            to { transform: translateX(30px); }
        }

        /* Card Container */
        .game-card {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 32px;
            padding: 30px 28px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(135, 180, 225, 0.35);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        /* Title Style */
        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #4a7bb0;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* Header info & Timer */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .q-counter {
            font-size: 15px;
            font-weight: 800;
            color: #72a3d0;
            background: #edf5fc;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .timer-badge {
            font-size: 15px;
            font-weight: 900;
            color: #3b82f6;
            background: #e0f2fe;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 10px;
            background: #e1f0fc;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #93c5fd, #60a5fa);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Question Box */
        .question-box {
            background: #f4f9ff;
            border-radius: 20px;
            padding: 20px 18px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-text {
            font-size: 17px;
            font-weight: 800;
            color: #335c85;
            line-height: 1.5;
        }

        /* Answers Grid */
        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .answer-btn {
            background: #f0f7ff;
            color: #3c6e9c;
            border: none;
            border-radius: 18px;
            padding: 14px 18px;
            font-size: 15.5px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
            transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.12s ease;
            box-shadow: 0 4px 0 #cbe0f5;
            display: flex;
            align-items: center;
            line-height: 1.35;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #e4f1ff;
            box-shadow: 0 6px 0 #cbe0f5;
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cbe0f5;
        }

        /* Answer Status Classes */
        .answer-btn.correct {
            background: #bbf7d0 !important;
            color: #166534 !important;
            box-shadow: 0 4px 0 #86efac !important;
        }

        .answer-btn.wrong {
            background: #fecaca !important;
            color: #991b1b !important;
            box-shadow: 0 4px 0 #fca5a5 !important;
        }

        /* Explanation Box */
        .explanation-box {
            background: #eff6ff;
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 800;
            color: #1e40af;
            line-height: 1.4;
            display: none;
            margin-top: 5px;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4deg); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start / Result Screens */
        .start-screen, .result-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 10px 0;
        }

        .big-btn {
            background: #60a5fa;
            color: white;
            border: none;
            border-radius: 22px;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #3b82f6;
            transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.12s ease;
            margin-top: 10px;
        }

        .big-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #2563eb;
        }

        .big-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #2563eb;
        }

        .score-display {
            font-size: 38px;
            font-weight: 900;
            color: #2563eb;
            margin: 8px 0;
        }

        .result-msg {
            font-size: 19px;
            font-weight: 900;
            color: #335c85;
            line-height: 1.5;
            margin-bottom: 10px;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <!-- Kawaii White Bear Vector (Lineless) -->
    <svg class="bg-decor bear-container" viewBox="0 0 200 200" fill="none">
        <circle cx="50" cy="50" r="28" fill="#FFFFFF"/>
        <circle cx="50" cy="50" r="16" fill="#FFDBE5"/>
        <circle cx="150" cy="50" r="28" fill="#FFFFFF"/>
        <circle cx="150" cy="50" r="16" fill="#FFDBE5"/>
        <ellipse cx="100" cy="115" rx="70" ry="60" fill="#FFFFFF"/>
        <ellipse cx="100" cy="120" rx="22" ry="16" fill="#F0F4F8"/>
        <ellipse cx="100" cy="114" rx="10" ry="7" fill="#4B5563"/>
        <circle cx="72" cy="100" r="6.5" fill="#374151"/>
        <circle cx="128" cy="100" r="6.5" fill="#374151"/>
        <circle cx="74" cy="98" r="2" fill="#FFFFFF"/>
        <circle cx="130" cy="98" r="2" fill="#FFFFFF"/>
        <ellipse cx="62" cy="112" rx="9" ry="5.5" fill="#FFB6C1" opacity="0.75"/>
        <ellipse cx="138" cy="112" rx="9" ry="5.5" fill="#FFB6C1" opacity="0.75"/>
    </svg>

    <!-- Kawaii Big Ribbon Bow Vector (Lineless) -->
    <svg class="bg-decor bow-container" viewBox="0 0 160 160" fill="none">
        <path d="M80 80 C40 40, 10 50, 20 85 C30 115, 65 95, 80 80 Z" fill="#93C5FD"/>
        <path d="M80 80 C120 40, 150 50, 140 85 C130 115, 95 95, 80 80 Z" fill="#93C5FD"/>
        <path d="M30 70 C45 60, 60 70, 70 80" stroke="#BFDBFE" stroke-width="4" stroke-linecap="round"/>
        <path d="M130 70 C115 60, 100 70, 90 80" stroke="#BFDBFE" stroke-width="4" stroke-linecap="round"/>
        <path d="M72 82 Q55 125 40 140 C50 142 65 135 76 92 Z" fill="#60A5FA"/>
        <path d="M88 82 Q105 125 120 140 C110 142 95 135 84 92 Z" fill="#60A5FA"/>
        <rect x="68" y="68" width="24" height="24" rx="8" fill="#3B82F6"/>
    </svg>

    <!-- Background Cloud 1 -->
    <svg class="bg-decor cloud1" width="120" height="70" viewBox="0 0 120 70" fill="none">
        <path d="M20 50 C10 50 0 40 0 30 C0 20 10 12 22 13 C28 5 38 0 50 0 C65 0 77 8 82 20 C90 18 100 22 105 30 C112 30 120 38 120 48 C120 58 110 65 98 65 L20 65 C10 65 20 50 20 50 Z" fill="#FFFFFF"/>
    </svg>

    <!-- Background Cloud 2 -->
    <svg class="bg-decor cloud2" width="100" height="60" viewBox="0 0 100 60" fill="none">
        <path d="M15 42 C7 42 0 34 0 25 C0 17 8 10 18 11 C23 4 32 0 42 0 C55 0 65 7 69 17 C76 15 84 19 88 25 C94 25 100 32 100 40 C100 49 92 55 82 55 L15 55 Z" fill="#FFFFFF"/>
    </svg>

    <!-- Game Card Window -->
    <div class="game-card">
        <div class="game-title">ĐỐ VUI MẤT NÃO</div>

        <!-- Start Screen -->
        <div id="start-screen" class="start-screen">
            <p style="font-size: 16px; color: #5a82ab; font-weight: 800; line-height: 1.6;">
                15 câu đố xoắn não cực mạnh!<br>
                Mỗi câu hỏi bạn có <b>15 giây</b> để trả lời.<br>
                Cùng thử thách IQ ngay nào! ✨
            </p>
            <button class="big-btn" onclick="startGame()">Bắt Đầu Chơi</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" style="display: none;">
            <div class="header-bar">
                <div class="q-counter" id="q-counter">Câu 1/15</div>
                <div class="timer-badge">
                    ⏱️ <span id="timer-text">15s</span>
                </div>
            </div>

            <div class="progress-container">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div class="question-box">
                <div class="question-text" id="question-text">Loading...</div>
            </div>

            <div class="answers-grid" id="answers-grid"></div>

            <div class="explanation-box" id="explanation-box"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="result-screen" style="display: none;">
            <div class="score-display" id="score-text">0 / 15</div>
            <div class="result-msg" id="result-msg">...</div>
            <button class="big-btn" onclick="startGame()">Chơi Lại 🔄</button>
        </div>
    </div>

    <script>
        // Sound Effects generator using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.2); // C3
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        // Full 15 Questions Database
        const questions = [
            {
                question: "Câu 1: Một người đi làm tóc hết 100k. Sau khi làm xong, người đó đi qua đường thì bị gió thổi bay mất chiếc mũ bảo hiểm. Người đó quay lại tìm mũ. Hỏi họ mất gì nhiều nhất?",
                answers: [
                    "A. Mất 100k tiền làm tóc",
                    "B. Mất chiếc mũ bảo hiểm",
                    "C. Mất nếp tóc vừa làm đẹp",
                    "D. Mất đường về nhà"
                ],
                correct: 2,
                explain: "Vì gió thổi và mải cúi đầu tìm mũ nên nếp tóc mới làm sẽ bị hỏng hết."
            },
            {
                question: "Câu 2: Có một anh chàng đi mua một đôi giày hiệu hết 2 triệu. Trên đường về nhà, anh ta nhảy qua một vũng nước suýt ngã và làm rơi chiếc ví. Anh ta cúi xuống nhặt ví. Hỏi anh ta mất gì?",
                answers: [
                    "A. Mất tiền mua giày",
                    "B. Mất chiếc ví",
                    "C. Mất đôi giày mới",
                    "D. Mất công lau giày vì bị bẩn"
                ],
                correct: 3,
                explain: "Anh ta chỉ 'suýt ngã' và đã 'nhặt lại ví', nhưng cú nhảy qua vũng nước khiến anh ta mất công lau sạch đôi giày mới."
            },
            {
                question: "Câu 3: Một người đi mua kính cận hết 500k. Đeo kính mới vào, người đó đi bộ về nhà thì trời đổ mưa giông. Người đó chạy thật nhanh về nhà. Hỏi người đó mất gì lúc chạy?",
                answers: [
                    "A. Mất 500k",
                    "B. Mất tầm nhìn do nước mưa bám nhòe kính",
                    "C. Mất chiếc kính mới mua",
                    "D. Mất đôi giày đang đi"
                ],
                correct: 1,
                explain: "Đeo kính cận đi dưới mưa giông thì nước mưa sẽ làm nhòe hết mắt kính."
            },
            {
                question: "Câu 4: Có một người đàn ông leo lên một đỉnh núi cao để ngắm hoàng hôn. Khi lên đến đỉnh, ông ta mở balo ra ăn hết ổ bánh mì rồi đi xuống. Hỏi ông ta mất gì?",
                answers: [
                    "A. Mất ổ bánh mì và mất sức",
                    "B. Mất chiếc balo",
                    "C. Mất đường xuống núi",
                    "D. Mất máy ảnh"
                ],
                correct: 0,
                explain: "Ổ bánh mì đã ăn hết nên mất, và việc leo núi khiến ông ấy bị mất sức."
            },
            {
                question: "Câu 5: Một con hổ bị xích vào một gốc cây, sợi xích dài đúng 5 mét. Trước mặt con hổ có một bụi cỏ cách gốc cây 6 mét. Hỏi làm sao con hổ ăn được bụi cỏ đó?",
                answers: [
                    "A. Con hổ cố rướn người thêm 1 mét",
                    "B. Con hổ giật đứt sợi xích để ăn",
                    "C. Con hổ không cần ăn vì hổ không ăn cỏ",
                    "D. Chờ bụi cỏ tự mọc dài ra"
                ],
                correct: 2,
                explain: "Hổ là động vật ăn thịt, nó không ăn cỏ nên không cần phải tìm cách tiếp cận bụi cỏ."
            },
            {
                question: "Câu 6: Bác Ba nuôi 10 con bò. Mấy ngày sau, tất cả số bò trừ đi 9 con đều bị bệnh chết. Hỏi bác Ba còn lại bao nhiêu con bò sống?",
                answers: [
                    "A. 1 con",
                    "B. 9 con",
                    "C. 10 con",
                    "D. 0 con"
                ],
                correct: 1,
                explain: "Mẹo nằm ở câu chữ 'trừ đi 9 con đều chết', nghĩa là 9 con đó không chết và vẫn còn sống."
            },
            {
                question: "Câu 7: Một cô gái mua một chiếc váy trắng rất đẹp để đi dự tiệc. Khi bước xuống xe taxi, cô ấy vô tình làm rơi chiếc điện thoại xuống vũng bùn. Cô ấy vội cúi người nhặt điện thoại lên. Hỏi cô ấy mất gì?",
                answers: [
                    "A. Mất chiếc điện thoại",
                    "B. Mất buổi tiệc",
                    "C. Mất tiền taxi",
                    "D. Mất chiếc váy trắng tinh sạch sẽ"
                ],
                correct: 3,
                explain: "Điện thoại đã nhặt lại được, nhưng cúi người ở vũng bùn khi mặc váy dài sẽ làm bẩn hết chiếc váy trắng mới mua."
            },
            {
                question: "Câu 8: Một người đàn ông mua một hộp kem vị sô-cô-la hết 50k. Trên đường đi bộ về nhà, anh ta gặp một người bạn cũ và đứng lại buôn chuyện suốt 30 phút dưới trời nắng. Hỏi khi về đến nhà anh ta mất gì?",
                answers: [
                    "A. Mất tiền mua kem",
                    "B. Mất người bạn cũ",
                    "C. Mất hộp kem sô-cô-la dạng đặc ban đầu",
                    "D. Mất trí nhớ"
                ],
                correct: 2,
                explain: "Hộp kem đã bị chảy thành nước sau 30 phút đứng dưới trời nắng."
            },
            {
                question: "Câu 9: Có một cậu bé đi mua một quả bóng bay bơm khí heli hết 20k. Cậu bé vừa đi vừa nhảy chân sáo thì vô tình vấp ngã. Cậu bé liền buông tay để chống xuống đất. Hỏi cậu bé mất gì?",
                answers: [
                    "A. Mất quả bóng bay",
                    "B. Mất 20k tiền mặt",
                    "C. Mất đôi dép đang đi",
                    "D. Mất hàm răng"
                ],
                correct: 0,
                explain: "Vì buông tay ra nên quả bóng khí heli sẽ lập tức bay thẳng lên trời và mất luôn."
            },
            {
                question: "Câu 10: Nhà Nam có 4 anh em. Ba người anh đầu tên là Nhất, Nhị, Tam. Hỏi người em út tên là gì?",
                answers: [
                    "A. Tứ",
                    "B. Bốn",
                    "C. Nam",
                    "D. Bắc"
                ],
                correct: 2,
                explain: "Ngay đầu câu đã khẳng định 'Nhà Nam có 4 anh em', nên người còn lại chính là Nam."
            },
            {
                question: "Câu 11: Có một chiếc tàu điện đang chạy về hướng Nam với vận tốc 80km/h. Gió thổi mạnh về hướng Bắc với vận tốc 40km/h. Hỏi khói của con tàu sẽ bay về hướng nào?",
                answers: [
                    "A. Hướng Nam",
                    "B. Hướng Bắc",
                    "C. Không bay về hướng nào",
                    "D. Hướng Đông Bắc"
                ],
                correct: 2,
                explain: "Tàu điện thì làm gì có khói mà bay!"
            },
            {
                question: "Câu 12: Có một người tên là 'Đường' đi bộ ra tiệm tạp hóa mua một chai nước ngọt. Trên đường đi, anh ta liên tục bị kiến bu vào chân. Hỏi anh ta mất gì?",
                answers: [
                    "A. Mất tiền mua nước",
                    "B. Mất công đuổi kiến",
                    "C. Mất chai nước ngọt",
                    "D. Mất đôi giày"
                ],
                correct: 1,
                explain: "Mẹo chữ: Tên anh ta là 'Đường' (ngọt) nên kiến mới bu vào chân, anh ta phải mất công đuổi chúng đi."
            },
            {
                question: "Câu 13: Một người thợ săn đi vào rừng và mang theo một khẩu súng có đúng 1 viên đạn. Ông ta nhìn thấy một con chim đang đậu trên cành cây cao. Ông ta nổ súng và bắn trúng con chim. Hỏi trên cành cây còn lại mấy con chim?",
                answers: [
                    "A. Cực kỳ nhiều chim",
                    "B. Còn lại 1 con chim vừa bị bắn",
                    "C. Không còn con chim nào",
                    "D. Còn lại một nửa"
                ],
                correct: 2,
                explain: "Tiếng súng nổ rất to sẽ làm tất cả những con chim khác giật mình bay đi mất, còn con bị trúng đạn thì rơi xuống đất."
            },
            {
                question: "Câu 14: Một anh chàng lái xe tải đi vào một đoạn đường có biển báo cấm xe tải. Các chú cảnh sát giao thông đứng ở đó nhìn thấy anh ta nhưng không hề thổi còi hay phạt tiền. Hỏi tại sao?",
                answers: [
                    "A. Vì các chú cảnh sát đang bận",
                    "B. Vì anh chàng này đang đi bộ",
                    "C. Vì anh ta là người nhà của cảnh sát",
                    "D. Vì xe tải của anh ta không chở hàng"
                ],
                correct: 1,
                explain: "Đề bài chỉ nói 'Anh chàng lái xe tải đi vào', tức là anh ta đang đi bộ chứ không hề lái chiếc xe tải vào đoạn đường cấm."
            },
            {
                question: "Câu 15: Từ nào trong từ điển tiếng Việt mà tất cả người Việt Nam, kể cả các giáo sư ngôn ngữ học, đều phải phát âm sai?",
                answers: [
                    "A. Từ 'Sai'",
                    "B. Từ 'Ngọng'",
                    "C. Từ 'Khó'",
                    "D. Từ 'Lỗi'"
                ],
                correct: 0,
                explain: "Chính là từ 'Sai'. Khi bạn đọc từ 'Sai', bạn đang phát âm ra chữ 'sai'."
            }
        ];

        let currentQIndex = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval = null;
        let isAnswered = false;

        function startGame() {
            playSound('click');
            currentQIndex = 0;
            score = 0;
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";
            showQuestion();
        }

        function showQuestion() {
            isAnswered = false;
            clearInterval(timerInterval);

            const q = questions[currentQIndex];
            document.getElementById("q-counter").innerText = `Câu ${currentQIndex + 1}/${questions.length}`;
            document.getElementById("question-text").innerText = q.question;

            const answersGrid = document.getElementById("answers-grid");
            answersGrid.innerHTML = "";

            const expBox = document.getElementById("explanation-box");
            expBox.style.display = "none";
            expBox.innerText = "";

            q.answers.forEach((ansText, index) => {
                const btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = ansText;
                btn.onclick = () => handleAnswer(index);
                answersGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 15;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateTimerUI();
                    clearInterval(timerInterval);
                    handleTimeout();
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function updateTimerUI() {
            document.getElementById("timer-text").innerText = `${Math.ceil(timeLeft)}s`;
            const fillPercent = (timeLeft / 15) * 100;
            document.getElementById("progress-fill").style.width = `${fillPercent}%`;
        }

        function handleAnswer(selectedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            const q = questions[currentQIndex];
            const buttons = document.querySelectorAll(".answer-btn");

            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correct) {
                // Correct
                playSound('correct');
                buttons[selectedIndex].classList.add("correct");
                score++;

                // Instant transition to next question
                setTimeout(() => {
                    nextQuestion();
                }, 300);
            } else {
                // Wrong
                playSound('wrong');
                buttons[selectedIndex].classList.add("wrong");
                buttons[q.correct].classList.add("correct");

                const expBox = document.getElementById("explanation-box");
                expBox.innerText = "💡 Đáp án đúng: " + q.explain;
                expBox.style.display = "block";

                // Show correct answer and auto advance after short delay
                setTimeout(() => {
                    nextQuestion();
                }, 1200);
            }
        }

        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;

            playSound('wrong');
            const q = questions[currentQIndex];
            const buttons = document.querySelectorAll(".answer-btn");

            buttons.forEach(btn => btn.disabled = true);
            buttons[q.correct].classList.add("correct");

            const expBox = document.getElementById("explanation-box");
            expBox.innerText = "⏰ Hết giờ! Đáp án đúng: " + q.explain;
            expBox.style.display = "block";

            // Show correct answer and auto advance after 1 second
            setTimeout(() => {
                nextQuestion();
            }, 1000);
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "flex";

            document.getElementById("score-text").innerText = `${score} / ${questions.length}`;

            const resultMsg = document.getElementById("result-msg");
            if (score === 15) {
                resultMsg.innerText = "bạn là người ẩu bá khí nhất hôm nay 🔥🥶";
            } else if (score >= 3 && score <= 14) {
                resultMsg.innerText = "bạn đã làm tốt";
            } else {
                resultMsg.innerText = "chúc mừng bạn, bạn là một người đặc biệt (stoobid)";
            }
        }
    </script>
</body>
</html>
